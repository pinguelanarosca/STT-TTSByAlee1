<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="domeGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate Background Container -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <!-- 1. Gemini Star at Top -->
  <path d="M 64 8 Q 64 33 89 33 Q 64 33 64 58 Q 64 33 39 33 Q 64 33 64 8 Z" fill="url(#starGrad)" filter="url(#glow)"/>

  <!-- 2. Microphone (Left) tilted towards speaker -->
  <g transform="translate(48, 70) rotate(-22)">
    <!-- Handle -->
    <rect x="-4.5" y="0" width="9" height="20" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Head mesh -->
    <circle cx="0" cy="-6" r="7" fill="#cbd5e1" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- 3. Speaker Cone (Right) -->
  <g transform="translate(80, 70)">
    <!-- Outer rim -->
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Inner cone -->
    <circle cx="0" cy="0" r="9" fill="#1e293b"/>
    <!-- Center cap -->
    <circle cx="0" cy="0" r="5" fill="url(#domeGrad)"/>
  </g>

  <!-- 4. Sound Waves (Bottom) -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Left waves -->
    <path d="M 36 86 A 16 16 0 0 0 46 98"/>
    <path d="M 28 82 A 24 24 0 0 0 42 104"/>
    <path d="M 20 78 A 32 32 0 0 0 38 110"/>

    <!-- Right waves -->
    <path d="M 92 86 A 16 16 0 0 1 82 98"/>
    <path d="M 100 82 A 24 24 0 0 1 86 104"/>
    <path d="M 108 78 A 32 32 0 0 1 90 110"/>
  </g>
</svg>
